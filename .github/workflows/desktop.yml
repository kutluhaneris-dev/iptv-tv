name: Build desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'app/src/main/java/dev/kutluhan/iptv/data/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'app/src/main/java/dev/kutluhan/iptv/data/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  DESKTOP_VERSION: 1.0.${{ github.run_number }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            dir: dmg
            asset: IPTV-mac-apple-silicon.dmg
          - os: macos-15-intel
            task: packageDmg
            dir: dmg
            asset: IPTV-mac-intel.dmg
          - os: windows-latest
            task: packageMsi
            dir: msi
            asset: IPTV-windows.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        shell: bash
        run: ./gradlew -p desktop ${{ matrix.task }} --stacktrace

      - name: Check that video frames reach the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install --cask vlc >/dev/null
          brew install ffmpeg >/dev/null
          D="$RUNNER_TEMP"
          # A plain H.264 stream, an interlaced 1080i H.264 stream and an HEVC stream, like real IPTV channels.
          ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 15 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -f mpegts "$D/h264.ts"
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=25 -f lavfi -i sine=frequency=440 -t 15 \
            -vf "tinterlace=interleave_top,fieldorder=tff" -flags +ildct+ilme -c:v libx264 -pix_fmt yuv420p -c:a aac -f mpegts "$D/h264-1080i.ts"
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=25 -f lavfi -i sine=frequency=440 -t 15 \
            -c:v libx265 -pix_fmt yuv420p -tag:v hvc1 -c:a aac -f mpegts "$D/hevc.ts"
          set +e
          ./gradlew -p desktop frameCheck -Pmedia="$D/h264.ts,$D/h264-1080i.ts,$D/hevc.ts" > "$RUNNER_TEMP/framecheck.log" 2>&1
          status=$?
          grep -E "FRAMECHECK|Exception|^e: |FAILED" "$RUNNER_TEMP/framecheck.log" | head -60
          exit $status

      - name: Rename
        shell: bash
        run: cp desktop/build/compose/binaries/main/${{ matrix.dir }}/*.${{ matrix.dir }} "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Never marked latest, so the TV's releases/latest/download/iptv-tv.apk link keeps pointing at the APK.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.DESKTOP_VERSION }}
          name: IPTV Mac / Windows ${{ env.DESKTOP_VERSION }}
          files: assets/*
          make_latest: false
          body: |
            Mac (Apple Silicon: M1/M2/M3/M4) için IPTV-mac-apple-silicon.dmg, Intel Mac için IPTV-mac-intel.dmg, Windows için IPTV-windows.msi.
            Video için ücretsiz VLC'nin (https://www.videolan.org/vlc/) bilgisayarda kurulu olması gerekir.
